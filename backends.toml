# Backends the hub mounts. Each one's tools appear as "<name>_<tool>" (FastMCP namespace).
#
# kind = "local"  : in-process server from hub/ (only "kb")
# kind = "stdio"  : a subprocess; `command` + `args`; only the env vars in `env_secrets` (plus the few Windows
#                   needs to start a process) are passed, so the hub's own environment does not leak into it
# kind = "http"   : a remote Streamable HTTP server; `bearer_secret` names the secret sent as
#                   "Authorization: Bearer <secret>". The agent's hub token is never forwarded.
#
# Secrets are read from the OS keyring (Windows Credential Manager, macOS Keychain, Secret Service; service "mcp_hub",
# set with `python -m hub secret set NAME`) or, failing that, from an environment variable of the same name. Never put a key in this file.
# A backend whose `requires` secrets are missing is skipped at start ("disabled until configured").
# read_only: hide and refuse every tool the backend doesn't annotate with readOnlyHint=true.
# npm versions are pinned exactly: a new version is a code change the operator should see.

[backends.kb]
kind = "local"

[backends.context7]
kind = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.7.3"]     # CVE-2026-75130 fixed in 2.1.3
env_secrets = ["CONTEXT7_API_KEY"]               # optional: works keyless at the free rate limit

[backends.github]
kind = "http"
url = "https://api.githubcopilot.com/mcp/"
bearer_secret = "GITHUB_PAT"
requires = ["GITHUB_PAT"]
headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,issues,pull_requests" }
read_only = true

[backends.perplexity]
kind = "http"
url = "https://api.perplexity.ai/mcp"
bearer_secret = "PERPLEXITY_API_KEY"
requires = ["PERPLEXITY_API_KEY"]

[backends.consensus]
kind = "http"
url = "https://mcp.consensus.app/mcp"
auth = "oauth"            # OAuth 2.1 sign-in; the hub has no login flow yet, so this stays off (see README)
requires = ["CONSENSUS_OAUTH_ENABLED"]

[backends.firecrawl]
kind = "http"
url = "https://mcp.firecrawl.dev/v2/mcp"
bearer_secret = "FIRECRAWL_API_KEY"
requires = ["FIRECRAWL_API_KEY"]

[backends.playwright]
kind = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.86", "--isolated", "--headless"]   # in-memory profile: no saved logins

# A local stdio server of your own. Paths may be absolute or relative to state/ (the working directory the hub
# starts stdio backends in).
# [backends.my-tool]
# kind = "stdio"
# command = "/path/to/venv/bin/python"
# args = ["/path/to/my_tool/serve.py"]
# env_secrets = ["MY_TOOL_API_KEY"]
